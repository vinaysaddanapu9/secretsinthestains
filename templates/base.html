<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.jpg') }}?v=99">
    <meta charset="UTF-8">

    <meta name="description"
          content="Forensic science internships, fingerprint analysis training, crime scene investigation learning, forensic blogs and certificate programs.">

    <meta name="keywords"
          content="forensic science, forensic internship, fingerprint analysis, crime scene investigation, forensic education">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Secrets in the Stains{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        *{
            font-family: 'Poppins', sans-serif;
        }

        body{
            background:#f5f5f5;
            overflow-x:hidden;
            color:#111827;
        }

        /* Hero background */
        .forensic-bg{
            background:
                linear-gradient(
                    rgba(0,0,0,0.78),
                    rgba(0,0,0,0.82)
                ),
                url("{{ url_for('static', filename='images/hero-bg.png') }}");

            background-size:cover;
            background-position:center;
            background-attachment:fixed;
        }

        .accent{
            color:#e11d48;
        }

        /* Enhanced button */
        .btn-primary{
            background:linear-gradient(to right,#e11d48,#be123c);
            transition:all 0.3s ease;
            box-shadow:0 8px 24px rgba(225,29,72,0.25);
        }

        .btn-primary:hover{
            background:linear-gradient(to right,#be123c,#9f1239);
            transform:translateY(-2px);
            box-shadow:0 14px 32px rgba(225,29,72,0.35);
        }

        /* Smooth navbar links */
        nav a{
            position:relative;
            transition:all 0.3s ease;
        }

        nav a:hover{
            color:#fecdd3;
        }

        nav a::after{
            content:'';
            position:absolute;
            left:0;
            bottom:-4px;
            width:0%;
            height:2px;
            background:#fb7185;
            transition:width 0.3s ease;
        }

        nav a:hover::after{
            width:100%;
        }

        /* Logo enhancement */
        nav img{
            transition:all 0.3s ease;
            box-shadow:0 4px 14px rgba(0,0,0,0.35);
        }

        nav img:hover{
            transform:scale(1.05);
        }

        /* Better mobile spacing */
        @media (max-width:640px){

            nav .h-20{
                height:4.5rem;
            }

            nav h1{
                font-size:0.95rem;
            }

            nav p{
                font-size:0.65rem;
            }

            #mobile-menu{
                border-radius:1rem;
                margin:0.5rem;
                width:auto;
                left:0;
                right:0;
            }
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="fixed top-0 left-0 w-full z-50 bg-black/70 backdrop-blur-xl border-b border-white/10 shadow-lg shadow-black/20">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="flex justify-between items-center h-20">

            <!-- Logo + Brand -->
            <div class="flex items-center gap-3 min-w-0">

                <img
                    src="{{ url_for('static', filename='images/logo.jpg') }}"
                    alt="Secrets in the Stains"
                    class="h-12 sm:h-14 w-auto object-contain rounded-xl ring-2 ring-rose-500/20"
                >

                <div class="min-w-0">
                    <h1 class="text-white text-sm sm:text-xl font-extrabold tracking-wide truncate">
                        Secrets in the Stains
                    </h1>

                    <p class="text-gray-300 text-[10px] sm:text-xs uppercase tracking-[0.2em] truncate">
                        Science • Evidence • Truth
                    </p>
                </div>

            </div>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center gap-8 text-white text-sm font-medium">

                <a href="/alumni">
                    Success Stories
                </a>

                <a href="/certificate-verification">
                    Certificate Verification
                </a>

                <a href="/about">
                    About
                </a>

                <a href="/internships"
                   class="btn-primary text-white px-5 py-2.5 rounded-full font-semibold">
                    Explore Internships
                </a>

            </div>

            <!-- Mobile Menu Button -->
            <button id="menu-btn"
                    class="md:hidden text-white p-2 rounded-lg hover:bg-white/10 transition">

                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-7 w-7"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>

                </svg>

            </button>

        </div>

    </div>

</nav>

<!-- ================= MOBILE MENU ================= -->
<div id="mobile-menu"
     class="hidden md:hidden fixed top-20 left-0 w-full bg-black/95 backdrop-blur-xl text-white z-40 border-t border-white/10 shadow-2xl">

    <a href="/alumni"
       class="block px-6 py-4 border-b border-white/10 hover:bg-white/5 transition duration-300">
        Success Stories
    </a>

    <a href="/certificate-verification"
       class="block px-6 py-4 border-b border-white/10 hover:bg-white/5 transition duration-300">
        Certificate Verification
    </a>

    <a href="/about"
       class="block px-6 py-4 border-b border-white/10 hover:bg-white/5 transition duration-300">
        About
    </a>

    <div class="p-4">
        <a href="/internships"
           class="btn-primary block text-center text-white font-semibold px-5 py-3 rounded-xl">
            Explore Internships
        </a>
    </div>

</div>

<!-- ================= PAGE CONTENT ================= -->
<main class="pt-16 sm:pt-20 min-h-screen">

    {% block content %}
    {% endblock %}

</main>

<!-- ================= MOBILE MENU SCRIPT ================= -->
<script>
    document.getElementById("menu-btn").addEventListener("click", function() {
        document.getElementById("mobile-menu").classList.toggle("hidden");
    });
</script>

</body>
</html>
