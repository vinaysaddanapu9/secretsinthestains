<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for Webinar</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50">

<div class="max-w-5xl mx-auto py-12 px-6">

    <!-- Header -->

    <div class="bg-gradient-to-r from-indigo-700 to-blue-600 rounded-3xl text-white p-10 shadow-xl">

        <h1 class="text-4xl font-bold">
            Register for Webinar
        </h1>

        <p class="mt-3 text-indigo-100">
            Secure your seat and join our live interactive webinar.
        </p>

        <div class="grid md:grid-cols-4 gap-6 mt-8">

            <div>
                <p class="text-indigo-200 text-sm">Date</p>
                <h3 class="font-semibold">{{ webinar.webinar_date }}</h3>
            </div>

            <div>
                <p class="text-indigo-200 text-sm">Time</p>
                <h3 class="font-semibold">{{ webinar.webinar_time }}</h3>
            </div>

            <div>
                <p class="text-indigo-200 text-sm">Duration</p>
                <h3 class="font-semibold">{{ webinar.duration }}</h3>
            </div>

            <div>
                <p class="text-indigo-200 text-sm">Platform</p>
                <h3 class="font-semibold">{{ webinar.mode }}</h3>
            </div>

        </div>

    </div>

    <!-- Registration Form -->

    <div class="bg-white rounded-3xl shadow-2xl mt-10 p-10">

        <h2 class="text-3xl font-bold text-gray-800">
            Webinar Registration Form
        </h2>

        <p class="text-gray-500 mt-2">
            Please fill in your details below.
        </p>

        <form action="/register-webinar" method="POST" class="mt-8 space-y-6">

            <input type="hidden" name="webinar_id" value="{{ webinar.id }}">

            <div class="grid md:grid-cols-2 gap-6">

                <div>
                    <label class="block font-semibold mb-2">
                        Full Name *
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        required
                        class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Email Address *
                    </label>

                    <input
                        type="email"
                        name="email"
                        required
                        class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        WhatsApp Number *
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                        class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>

                    <label class="block font-semibold mb-2">
                        Gender *
                    </label>

                    <select
                        name="gender"
                        required
                        class="w-full border rounded-xl p-3">

                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Prefer not to say</option>

                    </select>

                </div>

                <div>

                    <label class="block font-semibold mb-2">
                        Educational Qualification *
                    </label>

                    <select
                        name="qualification"
                        required
                        class="w-full border rounded-xl p-3">

                        <option value="">Select Qualification</option>
                        <option>Diploma</option>
                        <option>Intermediate</option>
                        <option>B.Tech / B.E.</option>
                        <option>B.Sc</option>
                        <option>M.Tech</option>
                        <option>MCA</option>
                        <option>MBA</option>
                        <option>Ph.D.</option>
                        <option>Working Professional</option>

                    </select>

                </div>

                <div>

                    <label class="block font-semibold mb-2">
                        Institution / Organization *
                    </label>

                    <input
                        type="text"
                        name="organization"
                        required
                        class="w-full border rounded-xl p-3">

                </div>

                <div>

                    <label class="block font-semibold mb-2">
                        Department / Course *
                    </label>

                    <input
                        type="text"
                        name="department"
                        required
                        class="w-full border rounded-xl p-3">

                </div>

                <div>

                    <label class="block font-semibold mb-2">
                        City & State *
                    </label>

                    <input
                        type="text"
                        name="city_state"
                        required
                        class="w-full border rounded-xl p-3">

                </div>

            </div>

            <div>

                <label class="block font-semibold mb-2">
                    Any Questions for the Speaker?
                </label>

                <textarea
                    name="question"
                    rows="5"
                    class="w-full border rounded-xl p-3"
                    placeholder="Type your question here..."></textarea>

            </div>

            <div class="bg-indigo-50 rounded-xl p-5">

                <label class="flex items-start">

                    <input
                        type="checkbox"
                        name="consent"
                        required
                        class="mt-1 mr-3">

                    <span class="text-gray-700">
                        I agree to receive webinar updates, reminders, and joining instructions via Email and WhatsApp.
                    </span>

                </label>

            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-semibold py-4 rounded-xl transition">

                Register Now →

            </button>

        </form>

    </div>

</div>

</body>
</html>
