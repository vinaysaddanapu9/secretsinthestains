<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Secrets In The Stains</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#2B0613] via-[#4A0D1F] to-[#8B1E3F] flex items-center justify-center px-4 py-10 relative overflow-hidden">

    <!-- Decorative Blobs -->
    <div class="absolute top-0 left-0 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-yellow-300/10 rounded-full blur-3xl"></div>

    <div class="relative w-full max-w-md">

        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-8 md:p-10">

            <!-- Logo / Icon -->
            <div class="text-center">

                <div class="w-20 h-20 mx-auto bg-gradient-to-br from-[#8B1E3F] to-[#4A0D1F] rounded-2xl flex items-center justify-center shadow-lg mb-5">
                    <span class="text-4xl">🕵️</span>
                </div>

                <h1 class="text-3xl font-extrabold text-[#4A0D1F]">
                    Admin Portal
                </h1>

                <p class="text-gray-500 mt-2 text-sm">
                    Sign in to manage webinars, internships, and registrations
                </p>

            </div>

            <!-- Error Message -->
            {% if error %}
            <div class="mt-6 bg-red-100 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm text-center">
                {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="/admin-login" class="mt-8 space-y-5">

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Username
                    </label>

                    <div class="relative">

                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            👤
                        </span>

                        <input
                            type="text"
                            name="username"
                            required
                            placeholder="Enter your username"
                            class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#8B1E3F] focus:border-[#8B1E3F] outline-none transition duration-200 bg-white">

                    </div>

                </div>

                <div>

                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Password
                    </label>

                    <div class="relative">

                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                            🔒
                        </span>

                        <input
                            type="password"
                            name="password"
                            required
                            placeholder="Enter your password"
                            class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#8B1E3F] focus:border-[#8B1E3F] outline-none transition duration-200 bg-white">

                    </div>

                </div>

                <button
                    type="submit"
                    class="w-full bg-gradient-to-r from-[#8B1E3F] to-[#4A0D1F] hover:from-[#6D1A36] hover:to-[#2B0613] text-white py-3.5 rounded-xl font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition duration-300">
                    Login to Dashboard
                </button>

            </form>

            <!-- Footer -->
            <div class="text-center mt-8 text-xs text-gray-500">
                © 2026 <span class="font-semibold text-[#4A0D1F]">Secrets In The Stains</span>
            </div>

        </div>

    </div>

</body>
</html>
